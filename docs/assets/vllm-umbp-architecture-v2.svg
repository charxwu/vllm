<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">vLLM UMBPStoreConnector control and data plane bridge</title>
  <desc id="desc">The connector translates vLLM scheduling, block identity, and GPU memory into both UMBP control-plane operations and data-plane transfers.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526079; }
      .column-title { font-size: 21px; font-weight: 700; }
      .box-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; fill: #394861; }
      .small { font-size: 13px; fill: #526079; }
      .label { font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="920" fill="#f8fafc"/>
  <text x="720" y="47" text-anchor="middle" class="title">vLLM + MORI-UMBP Integration Architecture</text>
  <text x="720" y="75" text-anchor="middle" class="subtitle">UMBPStoreConnector is a protocol adapter spanning both control and data planes</text>

  <!-- Column backgrounds -->
  <rect x="38" y="105" width="380" height="748" rx="22" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <rect x="455" y="105" width="390" height="748" rx="22" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
  <rect x="882" y="105" width="520" height="348" rx="22" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="882" y="485" width="520" height="368" rx="22" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>

  <text x="228" y="143" text-anchor="middle" class="column-title" fill="#c2410c">vLLM</text>
  <text x="650" y="143" text-anchor="middle" class="column-title" fill="#6d28d9">UMBPStoreConnector</text>
  <text x="1142" y="143" text-anchor="middle" class="column-title" fill="#1d4ed8">UMBP Control Plane</text>
  <text x="1142" y="523" text-anchor="middle" class="column-title" fill="#047857">UMBP Data Plane</text>

  <!-- vLLM -->
  <rect x="74" y="177" width="308" height="146" rx="15" fill="#fff" stroke="#f97316" stroke-width="2"/>
  <text x="228" y="210" text-anchor="middle" class="box-title">Scheduler Process</text>
  <text x="228" y="240" text-anchor="middle" class="body">block hashes and prefix hits</text>
  <text x="228" y="264" text-anchor="middle" class="body">GPU block allocation and pinning</text>
  <text x="228" y="288" text-anchor="middle" class="body">recompute decisions</text>

  <rect x="74" y="365" width="308" height="196" rx="15" fill="#fff" stroke="#f97316" stroke-width="2"/>
  <text x="228" y="398" text-anchor="middle" class="box-title">Worker Process</text>
  <text x="228" y="427" text-anchor="middle" class="body">KVCacheConfig and tensor layout</text>
  <text x="228" y="451" text-anchor="middle" class="body">load/store execution hooks</text>
  <text x="228" y="475" text-anchor="middle" class="body">completion and preemption</text>
  <rect x="105" y="500" width="246" height="42" rx="9" fill="#ffedd5" stroke="#fb923c"/>
  <text x="228" y="526" text-anchor="middle" class="box-title" fill="#c2410c">Paged GPU KV Cache</text>

  <rect x="74" y="603" width="308" height="200" rx="15" fill="#fff" stroke="#f97316" stroke-width="2"/>
  <text x="228" y="636" text-anchor="middle" class="box-title">One Logical Token Block</text>
  <rect x="105" y="658" width="75" height="52" rx="7" fill="#fed7aa" stroke="#ea580c"/>
  <rect x="191" y="658" width="75" height="52" rx="7" fill="#fdba74" stroke="#ea580c"/>
  <rect x="277" y="658" width="75" height="52" rx="7" fill="#fb923c" stroke="#ea580c"/>
  <text x="142" y="689" text-anchor="middle" class="label">Layer 0</text>
  <text x="228" y="689" text-anchor="middle" class="label">Layer 1</text>
  <text x="314" y="689" text-anchor="middle" class="label">Layer N</text>
  <text x="228" y="739" text-anchor="middle" class="body">same block hash, separate GPU ranges</text>
  <text x="228" y="763" text-anchor="middle" class="small">gpu_block_id is a temporary physical slot</text>

  <!-- Connector as bridge -->
  <rect x="491" y="177" width="318" height="118" rx="15" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="650" y="209" text-anchor="middle" class="box-title">Identity &amp; Layout Adapter</text>
  <text x="650" y="238" text-anchor="middle" class="body">block hash to stable UMBP key</text>
  <text x="650" y="262" text-anchor="middle" class="body">layer GPU ranges to one object layout</text>

  <rect x="491" y="325" width="318" height="132" rx="15" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="650" y="357" text-anchor="middle" class="box-title">Scheduler Bridge</text>
  <text x="650" y="386" text-anchor="middle" class="body">BatchExists / prefix boundary</text>
  <text x="650" y="410" text-anchor="middle" class="body">load/store metadata</text>
  <text x="650" y="434" text-anchor="middle" class="body">publication visibility</text>

  <rect x="491" y="487" width="318" height="144" rx="15" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="650" y="519" text-anchor="middle" class="box-title">Transfer &amp; Lifecycle Bridge</text>
  <text x="650" y="548" text-anchor="middle" class="body">GPU memory registration</text>
  <text x="650" y="572" text-anchor="middle" class="body">BatchPutRanges / BatchGetRanges</text>
  <text x="650" y="596" text-anchor="middle" class="body">async completion and block pinning</text>

  <rect x="491" y="661" width="318" height="142" rx="15" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="650" y="694" text-anchor="middle" class="box-title" fill="#6d28d9">Safety Boundary</text>
  <text x="650" y="723" text-anchor="middle" class="body">miss | timeout | partial transfer</text>
  <text x="650" y="747" text-anchor="middle" class="body">stale route | incompatible layout</text>
  <text x="650" y="777" text-anchor="middle" class="label" fill="#6d28d9">fail closed to vLLM recomputation</text>

  <!-- Control plane -->
  <rect x="918" y="177" width="212" height="118" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="1024" y="209" text-anchor="middle" class="box-title">Master Query</text>
  <text x="1024" y="238" text-anchor="middle" class="body">BatchLookup</text>
  <text x="1024" y="262" text-anchor="middle" class="body">RoutePut / RouteGet</text>

  <rect x="1154" y="177" width="212" height="118" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="1260" y="209" text-anchor="middle" class="box-title">Global Projection</text>
  <text x="1260" y="238" text-anchor="middle" class="body">node and tier locations</text>
  <text x="1260" y="262" text-anchor="middle" class="body">capacity and heartbeat seq</text>

  <rect x="918" y="325" width="212" height="92" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="1024" y="357" text-anchor="middle" class="box-title">External KV Index</text>
  <text x="1024" y="385" text-anchor="middle" class="body">engine-local cache events</text>

  <rect x="1154" y="325" width="212" height="92" rx="14" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="1260" y="357" text-anchor="middle" class="box-title">Policy &amp; Metrics</text>
  <text x="1260" y="385" text-anchor="middle" class="body">placement and serving cost</text>

  <!-- Data plane -->
  <rect x="918" y="557" width="212" height="110" rx="14" fill="#fff" stroke="#059669" stroke-width="2"/>
  <text x="1024" y="589" text-anchor="middle" class="box-title">Transfer Engine</text>
  <text x="1024" y="618" text-anchor="middle" class="body">LocalCopy | HbmCopy</text>
  <text x="1024" y="642" text-anchor="middle" class="body">MORI-IO RDMA | AIS</text>

  <rect x="1154" y="557" width="212" height="110" rx="14" fill="#fff" stroke="#059669" stroke-width="2"/>
  <text x="1260" y="589" text-anchor="middle" class="box-title">Peer Slot Lifecycle</text>
  <text x="1260" y="618" text-anchor="middle" class="body">allocate | resolve</text>
  <text x="1260" y="642" text-anchor="middle" class="body">commit | evict</text>

  <rect x="918" y="707" width="132" height="82" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <rect x="1076" y="707" width="132" height="82" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="1234" y="707" width="132" height="82" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="984" y="738" text-anchor="middle" class="box-title" fill="#b91c1c">HBM</text>
  <text x="984" y="762" text-anchor="middle" class="small">optional, UMBP-owned</text>
  <text x="1142" y="738" text-anchor="middle" class="box-title" fill="#1d4ed8">DRAM</text>
  <text x="1142" y="762" text-anchor="middle" class="small">default backend</text>
  <text x="1300" y="738" text-anchor="middle" class="box-title" fill="#6d28d9">SSD / SPDK</text>
  <text x="1300" y="762" text-anchor="middle" class="small">capacity tier</text>

  <!-- vLLM to connector -->
  <line x1="382" y1="245" x2="491" y2="245" stroke="#475569" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <line x1="382" y1="427" x2="491" y2="390" stroke="#475569" stroke-width="3" marker-start="url(#arrow-slate)" marker-end="url(#arrow-slate)"/>
  <line x1="382" y1="521" x2="491" y2="559" stroke="#059669" stroke-width="4" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <line x1="382" y1="713" x2="491" y2="713" stroke="#475569" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <text x="437" y="232" text-anchor="middle" class="label">hashes</text>
  <text x="437" y="489" text-anchor="middle" class="label" fill="#047857">GPU ranges</text>

  <!-- connector to both planes -->
  <path d="M809 391 H862 V236 H918" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="9 7" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="864" y="309" transform="rotate(-90 864 309)" text-anchor="middle" class="label" fill="#1d4ed8">CONTROL: lookup, route, publish</text>

  <path d="M809 559 H862 V612 H918" fill="none" stroke="#059669" stroke-width="4" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <text x="864" y="586" transform="rotate(-90 864 586)" text-anchor="middle" class="label" fill="#047857">DATA: KV bytes</text>

  <!-- internal right-side links -->
  <line x1="1130" y1="236" x2="1154" y2="236" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M1260 295 V310 H1024 V325" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/>
  <path d="M1260 295 V325" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <line x1="1130" y1="612" x2="1154" y2="612" stroke="#059669" stroke-width="3" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <path d="M1260 667 V687 H984 V707" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M1260 687 H1142 V707" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <path d="M1260 687 H1300 V707" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Legend -->
  <line x1="456" y1="884" x2="500" y2="884" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 6"/>
  <text x="510" y="890" class="small">control metadata</text>
  <line x1="684" y1="884" x2="728" y2="884" stroke="#059669" stroke-width="4"/>
  <text x="738" y="890" class="small">KV bytes</text>
  <line x1="860" y1="884" x2="904" y2="884" stroke="#475569" stroke-width="3"/>
  <text x="914" y="890" class="small">vLLM connector contract</text>
</svg>
